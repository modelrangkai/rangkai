const PZINFO=`<div class="note"><b>Puzzle Pantun</b> adalah media interaktif berbasis <i>formative assessment</i> yang memberi umpan balik langsung tentang ketepatan susunan baris pantun.</div>
<h3 style="margin-top:1rem">Indikator yang diperiksa aplikasi</h3><ol><li><b>Rima akhir (a-b-a-b):</b> keselarasan bunyi akhir baris 1 dan 3 serta baris 2 dan 4.</li><li><b>Struktur pembagian baris:</b> baris 1–2 sebagai sampiran dan baris 3–4 sebagai isi.</li><li><b>Keterkaitan makna dan logika:</b> kepaduan, kelogisan, dan keutuhan makna baris isi.</li></ol>
<h3>Pemeriksaan dan umpan balik</h3><ul><li><b>Validasi kelengkapan:</b> aplikasi memeriksa apakah keempat slot baris sudah terisi dan menampilkan peringatan jika belum.</li><li><b>Jawaban salah:</b> siswa diarahkan memeriksa kembali rima dan urutan baris.</li><li><b>Jawaban benar:</b> muncul animasi confetti, poin dicatat, dan analisis struktur sampiran dan isi ditampilkan. Pada tema Teka-Teki, jawaban tebakan juga ditampilkan.</li></ul>
<h3>Sistem skor</h3><p>Aplikasi terdiri atas empat tema: Nasihat, Jenaka, Agama, dan Teka-Teki. Setiap tema memiliki satu puzzle pantun, sehingga ada empat soal dengan skor maksimal 25 poin per soal. Skor ditentukan oleh jumlah percobaan gagal.</p><div class="tw"><table class="sc"><tr><th>Percobaan</th><th>Skor soal</th></tr><tr><td>Langsung benar pada percobaan pertama</td><td>25</td></tr><tr><td>Satu kali salah, benar pada percobaan kedua</td><td>20</td></tr><tr><td>Dua kali salah, benar pada percobaan ketiga</td><td>15</td></tr><tr><td>Tiga kali salah atau lebih sebelum berhasil</td><td>10</td></tr></table></div>
<p style="margin-top:.8rem"><b>Nilai akhir Puzzle Pantun = jumlah skor dari empat tema.</b> Skor maksimal 100 poin.</p><p>Contoh: Nasihat 25 + Agama 25 + Teka-Teki 20 + Jenaka 15 = nilai akhir 85.</p>
